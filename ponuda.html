<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Generator ponuda - BizAI.rs</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
<h1>BizAI.rs</h1>
<p>AI Generator poslovnih ponuda</p>
</header>


<section class="hero">

<h2>Napravi profesionalnu ponudu za klijenta</h2>

<p>
Popuni podatke i napravi gotov poslovni dokument.
</p>


<label>Naziv firme:</label><br>
<input id="firma" type="text" placeholder="Moja firma">

<br><br>

<label>Ime klijenta:</label><br>
<input id="klijent" type="text" placeholder="Ime klijenta">

<br><br>

<label>Usluga:</label><br>
<input id="usluga" type="text" placeholder="Izrada sajta">

<br><br>

<label>Cena:</label><br>
<input id="cena" type="text" placeholder="500 €">

<br><br>

<label>Opis:</label><br>

<textarea id="opis" 
placeholder="Kratak opis usluge"></textarea>


<br><br>


<button onclick="napraviPonudu()">
Generiši ponudu
</button>


<h2>Rezultat:</h2>

<div id="rezultat" class="card">

Ovde će se pojaviti ponuda.

</div>


</section>


<script>

function napraviPonudu(){

let firma =
document.getElementById("firma").value;

let klijent =
document.getElementById("klijent").value;

let usluga =
document.getElementById("usluga").value;

let cena =
document.getElementById("cena").value;

let opis =
document.getElementById("opis").value;


let tekst = `

POŠTOVANI ${klijent},

Firma ${firma} vam predstavlja ponudu za uslugu:

${usluga}


Opis usluge:

${opis}


Ukupna cena ponude:
${cena}


Zahvaljujemo se na poverenju.

Srdačan pozdrav,

${firma}

`;


document.getElementById("rezultat").innerText = tekst;

}

</script>


</body>
</html>
