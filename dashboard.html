<!DOCTYPE html>
<html lang="sr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moj nalog - BizAI.rs</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<header>

<h1>BizAI.rs</h1>

<p>Moj korisnički panel</p>

</header>



<section class="hero">


<h2 id="pozdrav">
Dobrodošao u BizAI.rs 👋
</h2>


<div class="card">

<h3>Besplatni paket</h3>

<p>
Preostale AI generacije:
<strong>5</strong>
</p>

</div>


<br>


<div class="card">

<h3>Premium</h3>

<p>
Neograničeni AI alati
</p>

<h3>
7 € / mesečno
</h3>

<button>
Aktiviraj Premium
</button>

</div>


<br>


<a href="ponuda.html">
<button>
Napravi ponudu
</button>
</a>


</section>



<footer>

<p>
© 2026 BizAI.rs
</p>

</footer>

<script>

const supabaseClient = supabase.createClient(
"OVDE_TVOJ_PROJECT_URL",
"OVDE_TVOJ_PUBLISHABLE_KEY"
);


async function proveriKorisnika(){

const { data } = await supabaseClient.auth.getUser();


if(!data.user){

window.location.href = "login.html";

}
else{

document.getElementById("pozdrav").innerHTML =
"Zdravo, " + data.user.email + " 👋";

}

}


proveriKorisnika();


</script>
  
</body>

</html>
