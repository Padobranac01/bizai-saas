<!DOCTYPE html>
<html lang="sr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prijava - BizAI.rs</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>BizAI.rs</h1>

<p>Prijava korisnika</p>

</header>


<section class="hero">


<h2>Uloguj se</h2>


<input 
type="email" 
placeholder="Email adresa"
id="email"
>


<br><br>


<input 
type="password" 
placeholder="Lozinka"
id="lozinka"
>


<br><br>


<button onclick="prijava()">
Prijavi se
</button>


<p id="poruka"></p>


<p>
Nemaš nalog?
Registracija uskoro.
</p>


</section>


<script>

function prijava(){

let email = document.getElementById("email").value;
let lozinka = document.getElementById("lozinka").value;


if(email=="" || lozinka==""){

document.getElementById("poruka").innerHTML =
"Unesi email i lozinku";

}

else {

window.location.assign("./dashboard.html");

}

}

</script>


</body>

</html>
